name: Deploy F-Droid repo

# Manual runs for testing/forcing a rebuild, plus a daily sweep to pick up
# whatever VoxApps has released since the last run.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC daily

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; a new run supersedes an in-flight one
# rather than queuing behind it.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install apksigner and aapt
        run: |
          sudo apt-get update
          sudo apt-get install -y apksigner aapt

      - name: Install fdroidserver
        run: |
          pipx install fdroidserver
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Create repo/ directory
        run: mkdir -p repo

      - name: Download the latest APK per VoxApps app
        # VoxApps tags releases per app, resolve the newest tag per app prefix.
        # Metadata (changelogs/icons) is now pushed directly from VoxApps to this repo's metadata/ dir.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SOURCE_REPO="razvan-eduard/VoxApps"
          APPS="commander calendar expenses notes vision hub"
          for app in $APPS; do
            echo "== $app =="
            tag=$(gh release list --repo "$SOURCE_REPO" --limit 200 \
                  --json tagName,createdAt,isDraft \
                  --jq "[.[] | select(.isDraft == false) | select(.tagName | startswith(\"${app}-\"))] | sort_by(.createdAt) | last | .tagName // empty")
            if [ -z "$tag" ]; then
              echo "No release found for $app, skipping."
              continue
            fi
            echo "Latest $app release: $tag"
            gh release download "$tag" --repo "$SOURCE_REPO" --pattern "*.apk" --dir repo/ --clobber \
              || { echo "No .apk asset on $tag, skipping."; continue; }
          done
          echo "Downloaded VoxApps APKs:"
          ls -la repo/

      - name: Download the latest BorderKeys APK
        # A separate step because BorderKeys lives in its own repository and tags plain
        # versions rather than app-prefixed ones.
        #
        # Only the `core` flavour. Both flavours share the package id and the version code, so
        # indexing them together would leave fdroid picking one of two APKs that claim to be
        # the same release -- and `core` is the one without the inference runtime, which is
        # what this repository has always published.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SOURCE_REPO="razvan-eduard/borderkeys"
          tag=$(gh release list --repo "$SOURCE_REPO" --limit 200 \
                --json tagName,createdAt,isDraft \
                --jq '[.[] | select(.isDraft == false) | select(.tagName | startswith("v"))] | sort_by(.createdAt) | last | .tagName // empty')
          if [ -z "$tag" ]; then
            echo "No BorderKeys release found, skipping."
          else
            echo "Latest BorderKeys release: $tag"
            gh release download "$tag" --repo "$SOURCE_REPO" --pattern "*-core.apk" --dir repo/ --clobber \
              || echo "No core .apk asset on $tag, skipping."
          fi
          echo "Downloaded APKs:"
          ls -la repo/

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > keystore.p12

      - name: Configure signing key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          cat >> config.yml <<EOF
          keystore: $(pwd)/keystore.p12
          keystorepass: "$KEYSTORE_PASSWORD"
          keypass: "$KEYSTORE_PASSWORD"
          repo_keyalias: "vox-apps"
          EOF

      - name: fdroid update
        # Metadata folder is already populated with clean txt files from VoxApps.
        # We ensure F-Droid recognizes these apps by creating skeleton .yml files if missing.
        run: |
          for d in metadata/*/; do
            if [ -d "$d" ]; then
              pkg=$(basename "$d")
              if [ ! -f "metadata/$pkg.yml" ]; then
                echo "Creating skeleton metadata for $pkg"
                echo "Categories: [Office]" > "metadata/$pkg.yml"
              fi
            fi
          done
          fdroid update -c

      - name: Re-sign the index with a modern algorithm
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore keystore.p12 -storetype PKCS12 -storepass "$KEYSTORE_PASSWORD" \
            repo/index-v1.jar vox-apps
          jarsigner -verify repo/index-v1.jar

      - name: Structure for standard F-Droid URL
        run: |
          mkdir -p fdroid
          cp -r repo fdroid/
          
          # Create a root index.html redirect
          cat > index.html <<EOF
          <!DOCTYPE html>
          <html>
          <head>
            <title>VoxApps F-Droid Repository</title>
            <meta http-equiv="refresh" content="0; url=fdroid/repo/">
          </head>
          <body>
            <p>The repository has moved to <a href="fdroid/repo/">fdroid/repo/</a>.</p>
          </body>
          </html>
          EOF

      - name: Remove the decoded keystore before publishing
        if: always()
        run: rm -f keystore.p12

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
