name: Deploy F-Droid repo

# Manual runs for testing/forcing a rebuild, plus a daily sweep to pick up
# whatever VoxApps has released since the last run.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC daily

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; a new run supersedes an in-flight one
# rather than queuing behind it.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install apksigner and aapt
        run: |
          sudo apt-get update
          sudo apt-get install -y apksigner aapt

      - name: Install fdroidserver
        # Not apt-get: Ubuntu's packaged fdroidserver (2.2.1) ships an old androguard that fails on
        # newer AAPT2-compiled resources.arsc ("androguard.core.bytecodes.axml.ResParserError: res1
        # must be zero!") — confirmed on-run against real VoxApps release APKs. pipx installs the
        # current PyPI release in its own venv, which F-Droid's own docs recommend for CI use anyway.
        run: |
          pipx install fdroidserver
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Create repo/ directory
        run: mkdir -p repo

      - name: Download the latest APK per VoxApps app
        # VoxApps tags releases per app (commander-vX.Y, calendar-vX.Y, ...), not one combined
        # release for the whole monorepo — "gh release view --latest" would only ever return
        # whichever single app happened to publish most recently, silently dropping every other
        # app from the mirror. Instead, resolve the newest tag per app prefix explicitly.
        #
        # Also stages each release's changelog: VoxApps' release workflows already run with
        # generate_release_notes: true, so every GitHub release has real "what changed" text
        # sitting in its body — fdroid update never sees it on its own, though. It only picks up
        # changelog text from metadata/<packageName>/en-US/changelogs/<versionCode>.txt files
        # sitting alongside repo/ at index-build time, so that's what gets written here, using
        # aapt (not a hardcoded app->package table) to read the real packageName/versionCode
        # straight out of the downloaded APK — the same source of truth fdroid update itself uses.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SOURCE_REPO="razvan-eduard/VoxApps"
          APPS="commander calendar expenses notes vision hub"
          for app in $APPS; do
            echo "== $app =="
            tag=$(gh release list --repo "$SOURCE_REPO" --limit 200 \
                  --json tagName,createdAt,isDraft \
                  --jq "[.[] | select(.isDraft == false) | select(.tagName | startswith(\"${app}-\"))] | sort_by(.createdAt) | last | .tagName // empty")
            if [ -z "$tag" ]; then
              echo "No release found for $app, skipping."
              continue
            fi
            echo "Latest $app release: $tag"
            gh release download "$tag" --repo "$SOURCE_REPO" --pattern "*.apk" --dir repo/ --clobber \
              || { echo "No .apk asset on $tag, skipping."; continue; }

            apk=$(ls -t repo/*.apk | head -1)
            badging=$(aapt dump badging "$apk")
            package_name=$(echo "$badging" | sed -n "s/.*package: name='\([^']*\)'.*/\1/p")
            version_code=$(echo "$badging" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")
            if [ -z "$package_name" ] || [ -z "$version_code" ]; then
              echo "Couldn't read package/versionCode from $apk, skipping changelog."
              continue
            fi

            changelog_dir="metadata/$package_name/en-US/changelogs"
            mkdir -p "$changelog_dir"
            gh release view "$tag" --repo "$SOURCE_REPO" --json body --jq .body \
              > "$changelog_dir/$version_code.txt"
          done
          echo "Downloaded APKs:"
          ls -la repo/

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > keystore.p12

      - name: Configure signing key
        # keystorepass/keypass/repo_keyalias must live in config.yml itself — fdroidserver doesn't
        # read them from bare env vars — so they're appended here from the secret at runtime rather
        # than ever being committed to config.yml in the repo.
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          cat >> config.yml <<EOF
          keystore: $(pwd)/keystore.p12
          keystorepass: "$KEYSTORE_PASSWORD"
          keypass: "$KEYSTORE_PASSWORD"
          repo_keyalias: "vox-apps"
          EOF

      - name: fdroid update
        run: fdroid update -c

      - name: Re-sign the index with a modern algorithm
        # fdroid update's jarsigner call picks SHA1withRSA on this runner's JDK/keystore
        # combination — modern F-Droid clients (and modern JDKs) treat SHA1-signed jars as
        # unsigned and silently show zero apps, even though the underlying JSON is correct
        # (confirmed via `jarsigner -verify`: "WARNING: The jar will be treated as unsigned").
        # Re-signing explicitly with SHA-256 overrides that default.
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore keystore.p12 -storetype PKCS12 -storepass "$KEYSTORE_PASSWORD" \
            repo/index-v1.jar vox-apps
          jarsigner -verify repo/index-v1.jar

      - name: Remove the decoded keystore before publishing
        if: always()
        run: rm -f keystore.p12

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
